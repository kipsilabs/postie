name: Dev Build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/test

  test-windows:
    runs-on: windows-latest
    needs: []
    timeout-minutes: 30
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: ''
          update: false
          path-type: inherit

      # Pin the MinGW GCC toolchain (see build-cli-windows for rationale).
      - name: Pin MinGW GCC toolchain
        shell: msys2 {0}
        run: |
          GCC_VER=15.2.0-14
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${GCC_VER}-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${GCC_VER}-any.pkg.tar.zst
          gcc --version

      - name: Runner CPU info
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List

      # The root package embeds frontend/build, which is not built here, so the
      # sweep is limited to the library packages.
      - name: Go tests
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
          CC: gcc
        run: |
          go version
          go test -count=1 ./internal/... ./pkg/...

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            frontend-deps-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Extract version info
        id: version
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=dev-$COMMIT" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        env:
          npm_package_version: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ steps.version.outputs.commit }}
        run: bun run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  build-gui-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up MSYS2 (needed for static linking of MinGW runtimes)
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: ''
          update: false
          path-type: inherit

      # Pin the MinGW GCC toolchain. MSYS2 is a rolling repo; GCC 16 dropped the
      # emulated-TLS std::call_once symbols (__emutls_v._ZSt11__once_call /
      # __once_callable) that the prebuilt par2go libparpar_gf16_windows_amd64.a
      # references, breaking the cgo link. Keep this version in sync with the one
      # par2go's libs were built with (github.com/javi11/par2go build-libs.yml).
      - name: Pin MinGW GCC toolchain
        shell: msys2 {0}
        run: |
          GCC_VER=15.2.0-14
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${GCC_VER}-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${GCC_VER}-any.pkg.tar.zst
          gcc --version

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Bun
        run: npm install -g bun

      - name: Build Windows GUI
        shell: msys2 {0}
        run: wails build -platform windows/amd64 -ldflags="-linkmode external -extldflags=-static"
        env:
          CGO_ENABLED: 1
          CC: gcc
          CGO_LDFLAGS: '-static-libgcc -static-libstdc++'

      - name: Verify no MinGW runtime DLL dependencies
        uses: ./.github/actions/verify-windows-gui-dlls

      - name: Upload Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: postie-gui-windows-amd64
          path: build/bin
          retention-days: 7

  build-cli-windows:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: ''
          update: false
          path-type: inherit

      # Pin the MinGW GCC toolchain (see build-gui-windows for rationale).
      - name: Pin MinGW GCC toolchain
        shell: msys2 {0}
        run: |
          GCC_VER=15.2.0-14
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${GCC_VER}-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${GCC_VER}-any.pkg.tar.zst
          gcc --version

      - name: Extract version info
        id: version
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=dev-$COMMIT" >> $GITHUB_OUTPUT

      # Build inside the MSYS2 shell so the pinned MSYS2 GCC (not the runner's
      # pre-installed MinGW) does the cgo link — its static libs make
      # -extldflags '-static' fully effective (same recipe as build-gui-windows).
      - name: Build Windows CLI
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: gcc
          CGO_LDFLAGS: '-static-libgcc -static-libstdc++'
        run: |
          go build \
            -trimpath \
            -tags=cli \
            -ldflags="-s -w -linkmode external -extldflags '-static' -X 'main.Version=${{ steps.version.outputs.version }}'" \
            -o "postie-cli-windows-amd64.exe" \
            ./cmd/postie

      - name: Verify no MinGW runtime DLL dependencies
        uses: ./.github/actions/verify-windows-gui-dlls
        with:
          exe-glob: postie-cli-windows-amd64.exe

      - name: Smoke test CLI startup
        uses: ./.github/actions/smoke-test-cli
        with:
          binary: ./postie-cli-windows-amd64.exe

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: postie-cli-windows-amd64-dev
          path: postie-cli-windows-amd64.exe
          retention-days: 7

  build-gui-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Bun
        run: npm install -g bun

      - name: Build macOS GUI
        run: wails build -platform darwin/universal
        env:
          CGO_ENABLED: 1

      - name: Upload macOS GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: postie-gui-macos-universal
          path: build/bin
          retention-days: 7

  build-image-amd64:
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-amd64-temp
          cache-from: type=gha,scope=dev-amd64
          cache-to: type=gha,mode=max,scope=dev-amd64
          provenance: false
          sbom: false

  build-image-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [test, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.ci
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-arm64-temp
          cache-from: type=gha,scope=dev-arm64
          cache-to: type=gha,mode=max,scope=dev-arm64
          provenance: false
          sbom: false

  create-docker-manifest:
    runs-on: ubuntu-latest
    needs: [build-image-amd64, build-image-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        run: |
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-amd64-temp"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-arm64-temp"

          echo "Creating dev manifest from:"
          echo "  AMD64: $AMD64_IMAGE"
          echo "  ARM64: $ARM64_IMAGE"

          # Create and push dev manifest
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev \
            $AMD64_IMAGE \
            $ARM64_IMAGE
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

      - name: Clean up temporary tags
        run: |
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-amd64-temp || true
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-arm64-temp || true
