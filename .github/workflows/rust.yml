name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --no-fail-fast

  binaries:
    name: build postie + postie-web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check, test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - run: cargo build --release -p postie-cli -p postie-web
      - name: Bundle frontend beside the binaries
        shell: bash
        run: cp -r ../frontend/build target/release/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: postie-rust-${{ matrix.os }}
          path: |
            rust/target/release/postie
            rust/target/release/postie.exe
            rust/target/release/postie-web
            rust/target/release/postie-web.exe
            rust/target/release/frontend
          if-no-files-found: ignore

  desktop:
    name: desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/desktop
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: rust/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: postie-desktop-${{ matrix.os }}
          path: rust/desktop/target/release/bundle/**/*
          if-no-files-found: error
