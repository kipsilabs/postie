name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  coverage:
    if: ${{ !contains(github.event.head_commit.message, 'docs:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go info
        run: |
          go version
          go env

      # The par2go/ParPar C kernel picks its SIMD path from the runner's CPU.
      # Record it so a native PAR2 segfault can be tied to a CPU family.
      - name: Runner CPU info
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 -o 'avx512[a-z_]*\|avx2\|gfni\|vbmi[0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          nproc

      # Install Bun
      - name: Install Bun
        run: npm install -g bun

      - name: Run tests with coverage
        run: |
          make coverage-ci

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out

      - name: Display coverage percentage
        run: |
          make coverage-total

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
