name: Rust release

on:
  push:
    tags:
      # v1.2.3 publishes a stable release; v1.2.3-rc.N a pre-release
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The release gate: nothing is published (GitHub release or Docker image) unless the whole suite
  # passes on every OS, including the round-trip suite (server/tests/roundtrip.rs), which downloads
  # each upload back, compares it byte for byte and checks its PAR2 set with par2cmdline.
  test:
    name: test gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install par2cmdline
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y par2
          else
            brew install par2
          fi
          echo "POSTIE_REQUIRE_PAR2=1" >> "$GITHUB_ENV"
      # Windows runs the same suite; only the external par2cmdline check is skipped there
      - run: cargo test --workspace --no-fail-fast
        working-directory: rust

  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, exe: "" }
          - { os: macos-latest, target: macos-arm64, exe: "" }
          - { os: windows-latest, target: windows-x86_64, exe: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - run: cargo build --release -p postie-cli -p postie-web
        working-directory: rust
      # smoke-test the binary that ships: one-shot upload, rejection and bad-input paths
      - name: Smoke-test the release binary
        shell: bash
        working-directory: rust
        run: POSTIE_BIN="$PWD/target/release/postie${{ matrix.exe }}" cargo test -p postie-cli --test cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="postie-rust-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "rust/target/release/postie${{ matrix.exe }}" "rust/target/release/postie-web${{ matrix.exe }}" "dist/$name/"
          cp -r frontend/build "dist/$name/frontend"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/desktop
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      # prebuilt tauri-cli (cargo-binstall falls back to compiling it if no binary matches)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      # pin the host target: without it binstall picked the x86_64 macOS build on arm64
      # runners, which ran cargo-tauri (and the cmake it spawns) under Rosetta
      - shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo binstall -y --locked --targets "$host" tauri-cli@2
      # Tauri skips the DMG window layout (background, drag-to-Applications positions) when CI is
      # set, since it scripts Finder; opt back in. Finder scripting can time out on hosted
      # runners, so retry (a rerun only re-bundles, the compile is already done), and fall back to
      # a plain DMG rather than failing the release.
      - shell: bash
        run: |
          for attempt in 1 2; do
            TAURI_BUNDLER_DMG_IGNORE_CI=true cargo tauri build && exit 0
            echo "::warning::cargo tauri build failed (attempt $attempt)"
          done
          if [ "$RUNNER_OS" = macOS ]; then
            echo "::warning::building the DMG without its Finder layout"
          fi
          cargo tauri build
        working-directory: rust/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            rust/desktop/target/release/bundle/**/*.dmg
            rust/desktop/target/release/bundle/**/*.msi
            rust/desktop/target/release/bundle/**/*-setup.exe
            rust/desktop/target/release/bundle/**/*.deb
            rust/desktop/target/release/bundle/**/*.rpm
            rust/desktop/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  docker:
    name: docker image (ghcr.io)
    # pushes to the registry, so it waits for the test gate
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: docker-cargo-cache
          key: docker-cargo-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: docker-cargo-${{ hashFiles('rust/Cargo.lock') }}-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "docker-cargo-cache/registry": "/usr/local/cargo/registry",
              "docker-cargo-cache/target": "/app/rust/target"
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
      - id: tag
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${GITHUB_REF_NAME}"
          # only a stable tag moves `latest`: a release candidate must not replace the stable image
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$tags,$image:latest"
          fi
          echo "image=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub release
    needs: [test, binaries, desktop, docker]
    runs-on: ubuntu-latest
    steps:
      # only the release assets: the run also holds docker's build record (*.dockerbuild),
      # which download-artifact cannot extract
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unsigned="Bundles are not signed with a developer certificate (macOS: ad-hoc signed). On first launch macOS says it cannot verify the app: open System Settings > Privacy & Security and click Open Anyway (or run \`xattr -dr com.apple.quarantine /Applications/Postie.app\`). Windows SmartScreen: More info > Run anyway."
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            kind=(--prerelease)
            title="$GITHUB_REF_NAME (Rust port, release candidate)"
            notes="Release candidate of the Rust port (see rust/DECISIONS.md). Headless binaries (\`postie\` CLI and \`postie-web\` with its \`frontend/\` directory) and desktop bundles for Linux, macOS and Windows. $unsigned"
          else
            kind=(--latest --generate-notes)
            title="$GITHUB_REF_NAME"
            notes="Headless binaries (\`postie\` CLI and \`postie-web\` with its \`frontend/\` directory), desktop bundles for Linux, macOS and Windows, and the \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME\` Docker image. $unsigned"
          fi
          find artifacts -type f | sort
          mapfile -t files < <(find artifacts -type f | sort)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              "${kind[@]}" \
              --title "$title" \
              --notes "$notes"
          fi
