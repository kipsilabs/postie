<!DOCTYPE html>
<html lang="en" %sveltekit.theme%>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <script>
      // Runs before first paint: platform guess + theme, so there is no flash.
      (function () {
        var d = document.documentElement;
        try {
          var nav = navigator;
          var s = (
            ((nav.userAgentData && nav.userAgentData.platform) || nav.platform || "") +
            " " +
            nav.userAgent
          ).toLowerCase();
          var os = /mac|iphone|ipad|ipod|darwin/.test(s)
            ? "mac"
            : /windows|win32|win64/.test(s)
              ? "windows"
              : "linux";
          d.setAttribute("data-platform", os);
          d.setAttribute("data-desktop", window.go || window.wails ? "true" : "false");
        } catch (e) {
          d.setAttribute("data-platform", "linux");
          d.setAttribute("data-desktop", "false");
        }
        var pref = "system";
        try {
          pref = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        d.setAttribute("data-theme", dark ? "postie-dark" : "postie-light");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
