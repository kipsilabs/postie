# Development docker-compose for building from source
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  postie:
    container_name: postie-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: postie:dev
    ports:
      - "8080:8080"
    volumes:
      - ./example/config:/config
      - ./example/watch:/watch
      - ./example/output:/output
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      # With authentication off, the UI only answers localhost, IPs and these hostnames.
      # - POSTIE_ALLOWED_HOSTS=nas.local
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
