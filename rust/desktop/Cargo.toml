[package]
name = "postie-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Postie desktop shell (Tauri v2): runs the Postie web server in-process and shows it in a native window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
postie-core = { path = "../core" }
postie-web = { path = "../server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde_json = "1"
tokio-util = "0.7"
url = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }
