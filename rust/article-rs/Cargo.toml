[package]
name = "article-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `internal/article/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.10"
postie-yenc = { path = "../yenc" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
# generated lib.rs wraps no-argument ports in closures
redundant_closure = "allow"
