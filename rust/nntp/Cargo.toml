[package]
name = "postie-nntp"
version = "0.1.0"
edition = "2024"
publish = false
description = "NNTP client for posting: pipelined POST and STAT, lazy per-provider pools, SOCKS5, TLS, shared throttle"

[dependencies]
async-channel = "2"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-socks = "0.5"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies.postie-yenc]
path = "../yenc"

[[example]]
name = "upload_bench"
path = "examples/upload_bench.rs"
