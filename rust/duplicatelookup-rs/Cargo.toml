[package]
name = "duplicatelookup-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `internal/duplicatelookup/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
quick-xml = "0.42"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
