[package]
name = "duplicatelookup-rs"
version = "0.1.1"
edition = "2024"
publish = false
description = "Rust port of `internal/duplicatelookup/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# the rust-anything C entry points; opt-in: the symbols of both bridge crates collide when linked into one binary
default = []
c-abi = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
quick-xml = "0.42"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
