[package]
name = "postie-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Postie core library: stateful and IO units ported from the Go internal/ packages"

[dependencies]
base64 = "0.22"
brotli = "9"
zip = { version = "9", default-features = false, features = ["deflate"] }
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
duplicatelookup-rs = { path = "../duplicatelookup-rs" }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
postie-yenc = { path = "../yenc" }
zstd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
